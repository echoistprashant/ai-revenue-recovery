[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-revenue-recovery"
version = "0.1.0"
description = "Explainable recurring-payment recovery platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<0.117",
  "pydantic>=2.11,<3",
  "requests>=2.32,<3",
  "streamlit>=1.48,<1.49",
  "uvicorn>=0.35,<0.36",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8.4,<8.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
