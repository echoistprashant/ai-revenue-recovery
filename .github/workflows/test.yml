name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      # A migration that no longer matches the metadata is a deployment failure, so
      # CI applies it to a scratch database and asserts there is nothing left to add.
      - name: alembic upgrade and drift check
        env:
          REVENUE_RECOVERY_DATABASE: ci-migration-check.db
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - run: python scripts/train_recovery_model.py
      - run: python scripts/run_experiment.py

  # The frontend is verified with the same three gates its `npm run verify` script
  # runs locally, kept as separate steps so a failure names itself in the CI log.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
