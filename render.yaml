services:
  # 1. Backend API Service
  - type: web
    name: ai-revenue-recovery-api
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-revenue-db
          property: connectionString
      - key: TASK_EXECUTION_MODE
        value: queued
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # 2. Background Task Worker Service
  - type: worker
    name: ai-revenue-recovery-worker
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    dockerCommand: python scripts/run_worker.py
    plan: free
    region: singapore
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-revenue-db
          property: connectionString
      - key: TASK_EXECUTION_MODE
        value: queued
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

databases:
  # PostgreSQL Database
  - name: ai-revenue-db
    databaseName: revenue_recovery
    user: revenue
    plan: free
    region: singapore
